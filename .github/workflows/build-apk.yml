name: Build Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate keystores
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkey -v -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Apar Neupane,O=Krishi Loksewa Sathi,C=NP"

      - name: Generate gradlew and grant permission
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK (Direct File)
        uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          archive: false

      - name: Upload Keystore Backup (Direct File)
        uses: actions/upload-artifact@v7
        with:
          name: my-upload-key.jks
          path: my-upload-key.jks
          archive: false

      - name: Publish Public APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Krishi Loksewa Sathi (Latest APK)
          body: Download the latest Android APK directly below.
          files: app/build/outputs/apk/release/app-release.apk
